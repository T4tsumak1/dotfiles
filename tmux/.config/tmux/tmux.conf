#STA MERDA SI USA PRIMA PREMENDO IL PREFIX PER
#SCEGLIERE E POI SI RILASCIA E SI PREME LA CHIAVE 
#SONO RITARDATO

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1

set-option -g prefix C-b
set-option -g prefix2 none

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Caricato coglione, che palle..."

# Split Windows
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind "'"
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# Resize Panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

#maximize 
bind -r m resize-pane -Z

#mouse support
set -g mouse on

bind -r C-p previous-window
bind -r C-n next-window

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager
set-environment -g TMUX_PUGIN_MANAGER_PATH ~/.config/tmux/plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

#theme
# set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
# set -g @tmux-gruvbox 'dark256' # or 'dark256', 'light', 'light256'
# or set date in EU notation
# set -g @tmux-gruvbox-right-status-x '%d.%m.%Y' # e.g.: 30.01.2024
# set -g @tmux-gruvbox-left-status-a '#S' # tmux's session name
# display hostname and enhance section with other plugin
# set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'
#set -g @plugin 'jimeh/tmux-themepack'
#set -g @plugin 'cattpucin/tmux'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-fg "#3f3f3f"
set -g @tmux-dotbar-bg "#050203"
set -g @tmux-dotbar-fg-current "#BFBDB6"
set -g @tmux-dotbar-fg-session "#565B66"
set -g @tmux-dotbar-fg-prefix "#95E6CB"
set -g @tmux-dotbar-position "bottom"
set -g @tmux-dotbar-justify "absolute-centre"
set -g @tmux-dotbar-left "false"
set -g @tmux-dotbar-status-left "#S" # see code
set -g @tmux-dotbar-right "false"
set -g @tmux-dotbar-status-right "%H:%M" # see code
set -g @tmux-dotbar-window-status-format " #W "
set -g @tmux-dotbar-window-status-separator " • "
set -g @tmux-dotbar-maximized-icon "󰊓"
set -g @tmux-dotbar-show-maximized-icon-for-all-tabs false
set -g @tmux-dotbar-bold-status true
set -g @tmux-dotbar-bold-current-window false

set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # tmux session persist after restart


run '~/.config/tmux/plugins/tpm/tpm'
