background {
    monitor = 
    path = ~/.config/backgrounds/sfondino.png
    #color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}


input-field {
    monitor =
    size = 170, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2

    inner_color = rgba(0, 0, 0, 0.0) # no fill
    outer_color = rgba(0,0,0,0)
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = true
    rounding = 10
    placeholder_text = The password is...  #Butta dentro password
    font_size = 20
    font_family = JetBrainsMono

    hide_input = false
    position = 0, -425
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = #f1dfda
    font_size = 30
    font_family = JetBrainsMono bold
    position = 0, -330
    halign = center
    valign = center
}

# D-M-Y
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = #f1dfda
    font_size = 15
    font_family = JetBrainsMono bold
    position = 0, -300
    halign = center
    valign = center
}
