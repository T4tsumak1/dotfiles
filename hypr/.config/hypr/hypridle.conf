general {
	lock_cmd = pidof hyprlock || hyprlock        #dico che il locking mechanism è hyprlock
    before_sleep_cmd = hyprlock                  # per hyprlock prima suspend penso
}

listener {
	timeout = 300
	on-timeout = loginctl lock-session           #così dopo <timeout> sec lo schermo va in blocco schermo
}

listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 400
    on-timeout = systemctl suspend               # dopo 400 secs si sospende, 100 secondi dopo hyprlock
}
