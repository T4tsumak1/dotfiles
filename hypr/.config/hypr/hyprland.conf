# config personale hyprland, sicuramente da migliorare

################
### MONITORS ###
################

source = ~/.config/hypr/conf/monitor.conf

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Qui setto alcuni programmi che uso come variabili env per i key binding
$terminal = kitty
$fileManager = kitty -e yazi #nemo
$menu = rofi -show drun
$neovim = kitty -e nvim .


#################
### AUTOSTART ###
#################

source = ~/.config/hypr/conf/autostart.conf


#############################
### ENVIRONMENT VARIABLES ###
#############################

source = ~/.config/hypr/conf/environment.conf


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


###############
### GENERAL ###
###############

source = ~/.config/hypr/conf/window.conf

##################
### DECORATION ###
##################

source = ~/.config/hypr/conf/decoration.conf

##################
### ANIMATIONS ###
##################

source = ~/.config/hypr/conf/animation.conf

###############
### LAYOUTS ###
###############

source = ~/.config/hypr/conf/layout.conf

############
### MISC ###
############

source = ~/.config/hypr/conf/misc.conf

##############
### CUSTOM ###
##############

source = ~/.config/hypr/conf/custom.conf

##########################
### KEYBOARD AND INPUT ###
##########################

source = ~/.config/hypr/conf/keyboard.conf

###################
### KEYBINDINGS ###
###################

source = ~/.config/hypr/conf/keybinding.conf


###################
### WINDOWRULES ###
###################

source = ~/.config/hypr/conf/windowrule.conf

