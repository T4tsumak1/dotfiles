decoration {
    rounding = 7#1
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 9
        color = rgba(0,0,0,0.9) #rgba(1a1a1aee) scura
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = on
        ignore_opacity = true
        xray = true
        vibrancy = 0.3 # boh forse anche 0.6??
    }
}

#layerrule = blur, waybar
