
# GTK
env = GTK_THEME, Gruvbox-Dark #gruvbox-dark-gtk
env = GTK_ICON_THEME, Gruvbox-Plus-Dark #oomox-gruvbox-dark
env = GTK_APPLICATION_PREFER_DARK_THEME, 1

#QT??
#env = QT_STYLE_OVERRIDE, gruvbox-dark-gtk

# cursor size
env = XCURSOR_THEME, Bibata-Modern-Classic # oppure in un file cursor a parte lo fai settare da hyprctl setcursor
env = XCURSOR_SIZE,22
env = HYPRCURSOR_SIZE,24

# Toolkit Backend (per programmi che altrimenti runnerebbero con X11)
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1
