# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize on, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# Non so dove metterli
layerrule = blur on, match:class swaync-control-center
layerrule = blur on, match:class swaync-notification-window
layerrule = blur on, match:class logout_dialog

layerrule = blur on, match:class waybar
layerrule = ignore_alpha 0.5, match:class waybar
layerrule = no_anim on, match:class waybar

windowrule = force_rgbx on, match:class swaync-control-center
windowrule = force_rgbx on, match:class swaync-notification-window

layerrule = ignore_alpha 0.5, match:class swaync-control-center
layerrule = ignore_alpha 0.5, match:class swaync-notification-window
