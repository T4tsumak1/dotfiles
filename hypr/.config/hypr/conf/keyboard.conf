input {
    kb_layout = gb,it
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle # shift e alt e cambia lingua
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true #questo è per lo scroll e false è inverso
        scroll_factor = 1.5
    }
}

gestures {
    workspace_swipe_distance = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
