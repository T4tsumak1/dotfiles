general {
    gaps_in = 7
    gaps_out = 8 #10

    border_size = 0 #2

    col.active_border = rgba(0,0,0,0) #rgba(241,223,218,0.6) 45deg # rgba(22,30,22,1) è #161e16
    col.inactive_border =  rgba(0,0,0,0) #rgba(1,1,1,0.9)#rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

