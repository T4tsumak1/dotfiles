# carico wallpaper
exec-once = hyprpaper

# hyprlock perchè non si carica da hypridle
exec-once = hyprlock

#carico filtro luce blu gammastep
exec-once = ~/.config/hypr/scripts/gammastep-notify.sh

# per startare swaync notification daemon
exec-once = swaync

# uso hypridle per startere hyprlock e far aspettare agli altri 2s
exec-once = hypridle

# per startare waybar
exec-once = waybar

# per mettere tutte le env variables nell'ambiente
exec = dbus-update-activation-environment --all

exec = gsettings set org.gnome.desktop.interface text-scaling-factor 1

# per clipboard manager
exec-once = wl-paste -p -t text --watch clipman store -P --histpath="~/.local/share/clipman-primary.json"

# per waybar auto hide
exec-once = ~/.config/hypr/scripts/waybar_auto_hide &
