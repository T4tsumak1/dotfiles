# BEGIN_KITTY_THEME
#theme
# END_KITTY_THEME
# font_family JetBrainsMono Nerd Font
# bold_font	auto
# italic_font	auto
# bold_italic_font auto

#font_size 12
# 0.9 bg opacity usata con sfondo chiarissimo

# 0.4, 40
background_opacity 0.6 
background_blur_radius 80

map ctrl+alt+h previous_window
map ctrl+alt+l next_window

initial_window_width 100c
initial_window_height 30c
# font_family JetBrainsMono Nerd Font Regular #pure Iosevka Term da provare
# bold_font JetBrainsMono Nerd Font Extra Bold
# bold_italic_font JetBrainsMono Nerd Font Extra Bold Italic
# font_size 10.0 solo che divento cieco oppure 11
font_size 10
text_composition_strategy legacy
modify_font cell_width 95%

#shell_integration no-cursor
enable_audio_bell no

dynamic_background_opacity yes
#hide_window_decorations
window_padding_width 3
window_padding_height 3
#window_margin_width
background_blur 10
placement_strategy top

#cursor_trail 10

active_border_color #00ffff

window_border_width 1pt

tab_bar_style powerline
tab_powerline_style round


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_FONTS
#font_family      family="JetBrainsMono Nerd Font Mono"
#bold_font        auto
#italic_font      auto
#bold_italic_font auto
# END_KITTY_FONTS

shell_integration no-cursor
cursor_shape block
cursor_blink_interval -1
